name: V5 application checks
on:
  push:
    branches: [V5-20261020]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: scale_lab
          POSTGRES_PASSWORD: isolated-test-only-password
          POSTGRES_DB: scale_lab_ci_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U scale_lab -d scale_lab_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://scale_lab:isolated-test-only-password@127.0.0.1:5432/scale_lab_ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/admin/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend/admin
      - run: npm run build --prefix frontend/admin
      - run: npm audit --audit-level=moderate --prefix backend
      - run: npm audit --audit-level=moderate --prefix frontend/admin
      - run: npm run check
      - run: bash -n infrastructure/backup.sh infrastructure/restore.sh
      - run: npm run test:isolated --prefix backend
      - run: docker build -f infrastructure/Dockerfile -t scale-lab:v5-engineering-20261027 .
      - run: node backend/scripts/validate-production.js

