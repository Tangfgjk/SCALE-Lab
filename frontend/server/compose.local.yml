services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: scale_lab
      POSTGRES_DB: scale_lab
      POSTGRES_PASSWORD: ${SCALE_LAB_DB_PASSWORD:?Set SCALE_LAB_DB_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - scale-lab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scale_lab -d scale_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  scale-lab-pgdata:
