<body>
  <!-- 三种可切换的后台布局设计原型；所有内容与交互均为浏览器内示例，不连接后端。 -->
  <div class="prototype-ribbon">设计原型 · 示例数据 · 无后端</div>
  <div id="app"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div class="variant-switch" aria-label="布局方案切换">
    <button id="prev-variant" type="button" aria-label="上一种方案">←</button>
    <div class="label" id="variant-label"></div>
    <button id="next-variant" type="button" aria-label="下一种方案">→</button>
  </div>
  <script>
    const variants=[['A','侧栏工作台'],['B','编辑台'],['C','任务队列']];
    const modules=[['dashboard','工作台','◫'],['members','团队成员','♙'],['news','新闻动态','▤'],['publications','学术论文','▦'],['projects','科研项目','◇'],['directions','研究方向','⌁'],['activities','活动相册','▧'],['media','媒体库','▣'],['settings','站点设置','⚙'],['audit','操作记录','≡'],['accounts','账号管理','♧']];
    const records={
      members:[['王志锋','导师 · 中文已发布','published','2026-10-12'],['成员资料示例 A','在读成员 · 待核验','draft','2026-10-11'],['校友资料示例 B','校友 · 授权待确认','issue','2026-10-09']],
      news:[['实验室近期动态示例','活动报道 · 中文已发布','published','2026-10-12'],['学术交流消息示例','新闻草稿 · 英文待翻译','draft','2026-10-10'],['项目进展消息示例','新闻草稿 · 来源待核验','issue','2026-10-08']],
      publications:[['论文记录示例 A','2026 · 待核验发表阶段','issue','2026-10-11'],['论文记录示例 B','2025 · 中文已发布','published','2026-10-07'],['论文记录示例 C','2024 · 英文待审核','draft','2026-10-05']],
      projects:[['科研项目示例 A','在研 · 项目编号待核对','issue','2026-10-10'],['科研项目示例 B','结题 · 中文已发布','published','2026-10-07'],['科研项目示例 C','筹备 · 草稿','draft','2026-10-04']],
      directions:[['教育数据挖掘','方向 01 · 中文已发布','published','2026-10-12'],['多模态课堂分析','方向 02 · 内容待确认','draft','2026-10-11'],['教育人工智能理论与实证','方向 03 · 中文已发布','published','2026-10-09']],
      activities:[['实验室活动示例 A','相册 · 人像授权待确认','issue','2026-10-10'],['学术交流示例 B','活动 · 中文已发布','published','2026-10-06'],['团队分享示例 C','相册草稿','draft','2026-10-03']],
      media:[['封面图示例 A','图片 · 已获准公开','published','2026-10-11'],['活动照片示例 B','图片 · 授权待确认','issue','2026-10-09'],['成员照片示例 C','图片 · 草稿','draft','2026-10-08']],
      settings:[['站点名称与标识','中文已发布 · 英文草稿','published','2026-10-12'],['联系渠道','公开邮箱待核对','issue','2026-10-10'],['首页精选内容','草稿 · 待预览','draft','2026-10-08']],
      audit:[['发布新闻动态','内容管理员 · 中文','published','2026-10-12 15:42'],['保存成员资料草稿','内容管理员 · 中文','draft','2026-10-11 10:18'],['撤回照片公开授权','管理员 · 媒体库','issue','2026-10-10 09:25']],
      accounts:[['管理员账号示例','管理员 · 已启用','published','2026-10-12'],['内容人员账号示例','内容管理人员 · 已启用','published','2026-10-10']]
    };
    const state={variant:new URLSearchParams(location.search).get('variant')?.toUpperCase()||'A',module:'dashboard',selected:0,language:'zh',filter:'all',search:'',editing:false,isNew:false};
    if(!variants.some(v=>v[0]===state.variant))state.variant='A';
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const title=()=>modules.find(m=>m[0]===state.module)?.[1]||'工作台';
    const badge=s=>s==='published'?'<span class="pill">已发布</span>':s==='issue'?'<span class="pill issue">待核验</span>':'<span class="pill draft">草稿</span>';
    const rowData=()=>records[state.module]||[];
    function navButton(m,kind='side'){return `<button class="${kind==='side'?'nav-button':'nav-choice'} ${state.module===m[0]?'active':''}" type="button" data-module="${m[0]}"><span class="nav-icon">${m[2]}</span><span>${m[1]}</span>${kind==='side'&&records[m[0]]?`<span class="count">${records[m[0]].length}</span>`:''}</button>`}
    function intro(){return `<div class="eyebrow">CONTENT STUDIO / ${state.module==='dashboard'?'OVERVIEW':state.module.toUpperCase()}</div><h1 class="page-title">${state.module==='dashboard'?'让每一次更新都可信':title()}</h1><p class="page-lead">${state.module==='dashboard'?'集中处理待核验资料、正在编辑的草稿与近期发布。':'查看、整理和预览内容；此处所有操作只在原型页面展示。'}</p>`}
    function stats(){return [['07','内容模块','首版范围已覆盖'],['03','待核验条目','来源与授权需复核'],['05','已发布更新','公开内容保持独立版本'],['02','英文待完成','中文发布可先进行']].map((s,i)=>`<div class="card"><div class="eyebrow">0${i+1} / ${s[1]}</div><div class="stat-num mono">${s[0]}</div><div class="stat-label">${s[1]}</div><div class="stat-bottom">${s[2]}</div></div>`).join('')}
    function dashboardA(){return `<div class="a-hero"><div><div class="eyebrow" style="color:#55d4d1">TODAY'S PRIORITY</div><strong>先完成内容核验，再发布到官网</strong><p>成员授权、论文发表阶段和联系邮箱仍需确认。</p></div><button class="btn primary" data-module="members">查看待办 →</button></div><div class="a-stats">${stats()}</div><div class="two-col"><section class="card card-pad"><div class="spread section-head"><div><h2>需要你处理</h2><p>优先级按公开风险与最近更新时间排序</p></div><button class="link-btn" data-module="members">查看全部 →</button></div><ul class="list"><li><div class="row"><span class="icon-tile">♙</span><div><strong>校友资料示例 B</strong><div class="sub">团队成员 · 去向与照片授权待确认</div></div></div>${badge('issue')}</li><li><div class="row"><span class="icon-tile">▦</span><div><strong>论文记录示例 A</strong><div class="sub">学术论文 · 发表阶段待核对</div></div></div>${badge('issue')}</li><li><div class="row"><span class="icon-tile">⚙</span><div><strong>联系渠道</strong><div class="sub">站点设置 · 公开邮箱待核对</div></div></div>${badge('issue')}</li></ul></section><section class="card card-pad"><div class="section-head"><h2>最近更新</h2><p>便于继续编辑与追踪发布</p></div><ul class="list"><li><div><strong>教育数据挖掘</strong><div class="sub">研究方向 · 10 月 12 日</div></div>${badge('published')}</li><li><div><strong>学术交流消息示例</strong><div class="sub">新闻动态 · 10 月 10 日</div></div>${badge('draft')}</li><li><div><strong>实验室活动示例 A</strong><div class="sub">活动相册 · 10 月 10 日</div></div>${badge('issue')}</li></ul></section></div>`}
    function dashboardB(){return `<div class="b-metrics">${stats().replaceAll('class="card"','class=""')}</div><div class="b-feature"><section><div class="b-section-label">01 / 待办事项</div><div class="b-table"><table class="data-table"><thead><tr><th>内容</th><th>模块</th><th>状态</th></tr></thead><tbody><tr data-module="members"><td>校友资料示例 B</td><td>团队成员</td><td>${badge('issue')}</td></tr><tr data-module="publications"><td>论文记录示例 A</td><td>学术论文</td><td>${badge('issue')}</td></tr><tr data-module="settings"><td>联系渠道</td><td>站点设置</td><td>${badge('issue')}</td></tr></tbody></table></div></section><section><div class="b-section-label">02 / 内容发布节奏</div><div class="card card-pad"><div class="section-head"><h2>先核验中文，再推进英文</h2><p>每条语言版本独立检查；草稿不会直接改变官网。</p></div><div class="notice"><span>✓</span><div><strong>公开版本与草稿分离</strong><p>编辑已发布内容时，官网继续显示上一次发布的版本。</p></div></div><div class="rule"></div><div class="spread"><span class="muted">所有获准人员可编辑并直接发布，系统保留记录。</span><button class="btn" data-module="audit">操作记录 →</button></div></div></section></div>`}
    function dashboardC(){return `<div class="c-stage"><section class="card card-pad"><div class="eyebrow">SELECTED TASK / 01</div><h2 style="font-family:Songti SC,SimSun,serif;font-size:29px;margin:10px 0">核对校友资料公开范围</h2><p class="page-lead">成员信息已经整理为草稿。发布前需确认照片、简介与毕业去向的公开依据。</p><div class="rule"></div><div class="spread"><div><div class="small muted">所属模块</div><strong>团队成员 / 校友</strong></div>${badge('issue')}</div><div class="rule"></div><div class="notice amber"><span>!</span><div><strong>仍有 2 项待核验</strong><p>照片授权、毕业去向来源。可先保存草稿，确认后再发布。</p></div></div><div class="row" style="margin-top:22px"><button class="btn primary" data-module="members">进入内容编辑 →</button><button class="btn" data-action="preview">预览公开页</button></div></section><aside><div class="card card-pad"><div class="section-head"><h2>流程概览</h2><p>面向内容管理人员的连续操作</p></div><ul class="list"><li><strong>01　整理内容</strong><span class="check">✓</span></li><li><strong>02　核验来源与授权</strong><span class="warn">!</span></li><li><strong>03　预览中文页面</strong><span class="muted">—</span></li><li><strong>04　发布并留痕</strong><span class="muted">—</span></li></ul></div></aside></div>`}
    function toolbar(){return `<div class="spread" style="margin:22px 0 14px;align-items:flex-end"><div class="toolbar"><label class="sr" for="search">搜索内容</label><input id="search" class="field search" placeholder="搜索${title()}" value="${esc(state.search)}"><label class="sr" for="status-filter">筛选状态</label><select id="status-filter" class="field"><option value="all" ${state.filter==='all'?'selected':''}>全部状态</option><option value="published" ${state.filter==='published'?'selected':''}>已发布</option><option value="draft" ${state.filter==='draft'?'selected':''}>草稿</option><option value="issue" ${state.filter==='issue'?'selected':''}>待核验</option></select></div>${state.module==='audit'?'<span class="small muted">操作记录为只读示意</span>':`<button class="btn primary" data-action="create">＋ 新建${title()==='媒体库'?'文件':'内容'}</button>`}</div>`}
    function listing(){let rows=rowData().map((r,i)=>({r,i})).filter(o=>(state.filter==='all'||o.r[2]===state.filter)&&o.r[0].toLowerCase().includes(state.search.toLowerCase()));return `${toolbar()}<div class="card table-wrap"><table class="data-table"><thead><tr><th>标题 / 名称</th><th>内容说明</th><th>状态</th><th>最近更新</th><th>操作</th></tr></thead><tbody>${rows.length?rows.map(o=>`<tr data-open="${o.i}"><td>${esc(o.r[0])}</td><td class="muted">${esc(o.r[1])}</td><td>${badge(o.r[2])}</td><td class="muted mono">${esc(o.r[3])}</td><td><button class="link-btn" data-open="${o.i}">${state.module==='audit'?'查看':'编辑'} →</button></td></tr>`).join(''):`<tr><td colspan="5" class="muted" style="text-align:center;padding:32px">没有符合筛选条件的示例内容</td></tr>`}</tbody></table></div><p class="small muted" style="margin:13px 0 0">当前为示例数据。列表、筛选和编辑区展示交互布局，不会写入数据库。</p>`}
    function editor(){const r=state.isNew?['新内容草稿','待填写','draft','今天']:(rowData()[state.selected]||['新内容草稿','待填写','draft','今天']);const isRead=state.module==='audit';const canPublish=r[2]!=='issue'&&!isRead&&state.language==='zh';return `<div class="spread" style="margin:20px 0"><button class="btn ghost" data-action="back">← 返回${title()}列表</button><div class="segmented" aria-label="内容语言"><button data-lang="zh" class="${state.language==='zh'?'active':''}">中文</button><button data-lang="en" class="${state.language==='en'?'active':''}">English</button></div></div><div class="spread" style="margin-bottom:18px"><div><div class="eyebrow">${isRead?'AUDIT RECORD':'CONTENT EDITOR'} / ${state.language.toUpperCase()}</div><h2 style="font-size:22px;margin:7px 0">${esc(r[0])}</h2><div class="small muted">${esc(r[1])}　·　上次更新 ${esc(r[3])}</div></div>${badge(r[2])}</div><div class="editor"><section class="card card-pad"><h3>${isRead?'记录详情':'基本信息'}</h3><div class="form-grid"><label class="wide">${state.module==='members'?'姓名':state.module==='settings'?'设置项':'标题 / 名称'}<input class="field" value="${state.isNew?'':esc(state.language==='en'?'Example content · English draft':r[0])}" ${isRead?'readonly':''}></label><label>内容分类<select class="field" ${isRead?'disabled':''}><option>${esc(title())}</option><option>其他分类</option></select></label><label>${state.module==='projects'?'项目进度':'公开状态'}<select class="field" ${isRead?'disabled':''}><option>${r[2]==='published'?'已发布':r[2]==='issue'?'待核验':'草稿'}</option></select></label><label class="wide">${state.module==='members'?'简介与研究兴趣':state.module==='settings'?'公开文案 / 设置值':'摘要 / 正文'}<textarea class="field" ${isRead?'readonly':''}>${state.language==='en'?'English content is pending translation review.':'在这里填写内容并保存草稿。公开页面只展示已发布且完成核验的版本。'}</textarea></label><label class="wide">事实来源或授权依据<input class="field" placeholder="填写来源链接或内部核验记录" ${isRead?'readonly':''}></label></div>${isRead?'':`<div class="rule"></div><div class="row" style="flex-wrap:wrap"><button class="btn" data-action="save">保存草稿</button><button class="btn" data-action="preview">预览公开页</button><button class="btn primary" data-action="publish" ${canPublish?'':'disabled'}>发布${state.language==='zh'?'中文版':'英文版'}</button><button class="btn ghost" data-action="withdraw">撤回</button></div>`}</section><aside><div class="card card-pad"><div class="section-head"><h3>发布前检查</h3><p>同一人可编辑与发布，系统保留操作记录</p></div><ul class="checklist"><li><span class="check">✓</span><span>标题与分类已填写</span></li><li><span class="${r[2]==='issue'?'warn':'check'}">${r[2]==='issue'?'!':'✓'}</span><span>事实来源${r[2]==='issue'?'待核验':'已记录'}</span></li><li><span class="${r[2]==='issue'?'warn':'check'}">${r[2]==='issue'?'!':'✓'}</span><span>图片与人物公开授权${r[2]==='issue'?'待确认':'已核对'}</span></li><li><span class="${state.language==='en'?'warn':'check'}">${state.language==='en'?'!':'✓'}</span><span>${state.language==='en'?'英文翻译待审核':'中文内容可独立发布'}</span></li></ul></div><div class="card card-pad" style="margin-top:14px"><h3>版本说明</h3><p class="small muted" style="line-height:1.7">编辑已发布内容将形成新草稿。官网继续展示上一个已发布版本，直到你确认发布。</p><button class="link-btn" data-action="history">查看修订历史 →</button></div></aside></div>`}
    function content(){if(state.module==='dashboard')return state.variant==='A'?dashboardA():state.variant==='B'?dashboardB():dashboardC();return state.editing?editor():listing()}
    function renderA(){return `<div class="a-shell"><aside class="a-side"><div class="brand dark"><span class="brand-mark">S</span><span><strong>SCALE Lab</strong><small>CONTENT STUDIO</small></span></div><nav aria-label="后台主导航"><div class="side-group">总览</div>${navButton(modules[0])}<div class="side-group">内容管理</div>${modules.slice(1,9).map(m=>navButton(m)).join('')}<div class="side-group">系统</div>${modules.slice(9).map(m=>navButton(m)).join('')}</nav><div class="side-foot">● 本地设计演示<br>管理员 / 内容管理人员 · 示例账号</div></aside><div class="a-main"><header class="a-top"><div class="crumb">后台管理 / ${title()} ${state.editing?'/ 编辑内容':''}</div><div class="row"><span class="muted small">中文优先 · English 可并行</span><span class="brand-mark" style="width:27px;height:27px;background:#e5f2ff;color:var(--blue);font-size:12px">管</span></div></header><main class="a-body"><div class="a-intro"><div>${intro()}</div>${state.module==='dashboard'?'<button class="btn primary" data-module="news">＋ 新建内容</button>':''}</div>${content()}</main></div></div>`}
    function renderB(){return `<div class="b-shell"><header class="b-top"><div class="brand"><span class="brand-mark">S</span><span><strong>SCALE Lab</strong><small>EDITORIAL OFFICE</small></span></div><nav class="b-nav" aria-label="后台主导航">${modules.slice(0,9).map(m=>`<button type="button" data-module="${m[0]}" class="${state.module===m[0]?'active':''}">${m[1]}</button>`).join('')}<button type="button" data-module="audit" class="${state.module==='audit'?'active':''}">记录</button><button type="button" data-module="accounts" class="${state.module==='accounts'?'active':''}">账号</button></nav></header><main class="b-body"><div class="b-heading"><div>${intro()}</div><aside>为实验室内容管理人员设计的编辑台。保留网站的学术气质，让内容、来源与发布状态一眼可查。</aside></div>${content()}</main></div>`}
    function renderC(){return `<div class="c-shell"><nav class="c-rail" aria-label="后台主导航"><span class="brand-mark">S</span>${modules.map(m=>`<button type="button" data-module="${m[0]}" class="${state.module===m[0]?'active':''}" title="${m[1]}"><b>${m[2]}</b><span>${m[1].slice(0,2)}</span></button>`).join('')}</nav><aside class="c-queue"><div class="eyebrow">MY QUEUE / 03</div><h2>${state.module==='dashboard'?'今日待处理':title()+'任务'}</h2><div class="queue-item active" data-module="members"><span class="pill issue">授权待确认</span><strong>核对校友资料公开范围</strong><small>团队成员 · 10 月 12 日</small></div><div class="queue-item" data-module="publications"><span class="pill issue">来源待核验</span><strong>检查论文发表阶段</strong><small>学术论文 · 10 月 11 日</small></div><div class="queue-item" data-module="settings"><span class="pill draft">草稿</span><strong>检查站点联系邮箱</strong><small>站点设置 · 10 月 10 日</small></div><div class="rule"></div><div class="small muted">浏览全部模块</div><div class="c-module-links" style="margin-top:10px">${modules.slice(1,9).map(m=>`<button data-module="${m[0]}">${m[1]}</button>`).join('')}</div></aside><main class="c-main"><div class="c-top"><div class="brand"><strong>SCALE Lab / 内容工作流</strong></div><div class="row small muted">示例账号 · 内容管理员 <span class="brand-mark" style="width:28px;height:28px;font-size:12px">管</span></div></div><div style="margin-top:25px">${intro()}</div>${content()}</main></div>`}
    function render(){document.getElementById('app').innerHTML=state.variant==='A'?renderA():state.variant==='B'?renderB():renderC();const v=variants.find(v=>v[0]===state.variant);document.getElementById('variant-label').innerHTML=`${v[0]} · ${v[1]}<span class="caption">← → 切换布局方案</span>`;document.title=`${v[0]} · ${v[1]} | SCALE Lab 后台设计原型`}
    function setVariant(key){state.variant=key;const url=new URL(location.href);url.searchParams.set('variant',key);history.replaceState({},'',url);render()}
    function cycle(step){const i=variants.findIndex(v=>v[0]===state.variant);setVariant(variants[(i+step+variants.length)%variants.length][0])}
    function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),3000)}
    function modal(kind){const r=rowData()[state.selected]||['新内容草稿','草稿'];let body=kind==='preview'?`<div class="eyebrow">PUBLIC PAGE PREVIEW / ${state.language.toUpperCase()}</div><h2>公开页预览</h2><p class="muted">模拟查看当前编辑内容的展示方式。</p><div class="preview-sheet"><div class="eyebrow">SCALE LAB · ${title()}</div><h3>${esc(r[0])}</h3><p>这里展示公开网站中的内容排版。正式开发时应与官网组件和真实发布规则一致。</p></div>`:`<div class="eyebrow">REVISION HISTORY</div><h2>修订历史</h2><p class="muted">正式版本应记录修改人、时间、语言与发布动作。</p><ul class="list"><li><div><strong>版本 03 · 当前草稿</strong><div class="sub">示例账号 · 2026-10-13 09:40</div></div>${badge('draft')}</li><li><div><strong>版本 02 · 中文已发布</strong><div class="sub">示例账号 · 2026-10-12 15:42</div></div>${badge('published')}</li></ul>`;document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" data-close="1"><div class="modal" role="dialog" aria-modal="true" aria-label="${kind==='preview'?'公开页预览':'修订历史'}">${body}<div class="spread"><span class="small muted">设计原型 · 示例内容</span><button class="btn" data-close="1">关闭</button></div></div></div>`}
    document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close&&(!e.target.closest('.modal')||e.target.closest('button'))){document.getElementById('modal-root').innerHTML='';return}const mod=e.target.closest('[data-module]');if(mod){state.module=mod.dataset.module;state.selected=0;state.editing=false;state.isNew=false;state.filter='all';state.search='';render();window.scrollTo(0,0);return}const open=e.target.closest('[data-open]');if(open){state.selected=Number(open.dataset.open);state.editing=true;state.isNew=false;render();window.scrollTo(0,0);return}const lang=e.target.closest('[data-lang]');if(lang){state.language=lang.dataset.lang;render();return}const action=e.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case'back':state.editing=false;state.isNew=false;render();break;case'create':state.editing=true;state.isNew=true;state.selected=0;render();toast('已打开示例编辑区，内容不会保存。');break;case'preview':modal('preview');break;case'history':modal('history');break;case'save':toast('原型演示：草稿操作已展示，未连接数据库。');break;case'publish':toast('原型演示：发布流程将在正式开发后接入。');break;case'withdraw':toast('原型演示：撤回流程将在正式开发后接入。');break}});
    document.addEventListener('input',e=>{if(e.target.id==='search'){state.search=e.target.value;const pos=e.target.selectionStart;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(pos,pos)}});
    document.addEventListener('change',e=>{if(e.target.id==='status-filter'){state.filter=e.target.value;render()}});
    document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal-root').innerHTML='';if(['ArrowLeft','ArrowRight'].includes(e.key)&&!e.target.closest('input,textarea,select,[contenteditable]'))cycle(e.key==='ArrowRight'?1:-1)});
    document.getElementById('prev-variant').addEventListener('click',()=>cycle(-1));document.getElementById('next-variant').addEventListener('click',()=>cycle(1));render();
  </script>
</body>
</html>
